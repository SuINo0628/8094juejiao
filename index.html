<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>你是谁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  :root{
    --bg:#FBF5EC;
    --ink:#2C2620;
    --ink-soft:#94877A;
    --surface:#FFFFFF;
    --line:#ECE1D2;
    --accent:#C9A06A;
    --shadow:0 12px 30px rgba(70,55,40,0.12);
    --shadow-sm:0 4px 14px rgba(70,55,40,0.08);
  }

  html,body{
    min-height:100%;
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
    background:var(--bg);
    user-select:none;
    overflow-x:hidden;
  }

  .hand{font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;}

  .screen{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 26px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;
    transform:translateY(8px);
    transition:opacity .4s ease,transform .4s ease;
  }
  .screen.show{opacity:1;pointer-events:auto;transform:none;}

  /* ============ 选人页 ============ */
  #selectScreen{background:var(--bg);}

  .select-head{margin:4px 4px 24px;}
  .select-kicker{font-size:13px;font-weight:500;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:8px;}
  .select-title{font-size:clamp(34px,11vw,46px);line-height:1;color:var(--ink);letter-spacing:.02em;}

  .friend-wall{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:14px 12px;width:100%;max-width:520px;margin:0 auto;
  }

  /* 圆角矩形卡片：名字直接写在矩形里，主题色用淡色底 + 小圆点代表（不用大圆形头像） */
  .friend{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    background:var(--surface);
    border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
    border-radius:18px;
    padding:30px 10px 28px;
    box-shadow:var(--shadow-sm);
    cursor:pointer;border:none;
    transition:transform .18s ease,box-shadow .18s ease,border-color .2s ease,background .2s ease;
  }
  .friend:active{transform:scale(.96);}
  @media(hover:hover){
    .friend:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));}
  }
  .friend-name{font-size:16px;font-weight:800;color:var(--accent);text-align:center;line-height:1.4;
    transition:transform .2s ease;}
  .friend:active .friend-name{transform:scale(.94);}

  /* ============ 互动页 ============ */
  #mainScreen{background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 10%,var(--bg)) 0%, var(--bg) 50%);}

  .back{
    position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;
    width:44px;height:44px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;z-index:8;
    transition:transform .15s ease;
  }
  .back:active{transform:scale(.88);}
  .back svg{width:20px;height:20px;}

  .stage{
    position:relative;
    width:100%;max-width:440px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    padding-top:8px;
  }

  .hi{
    position:relative;align-self:flex-start;margin-left:8px;
    font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;
    font-size:22px;color:color-mix(in srgb,var(--accent) 50%,#2C2620);
    background:var(--surface);border:1px solid var(--line);
    padding:4px 16px 6px;border-radius:14px;
    box-shadow:var(--shadow-sm);transform:rotate(-2deg);
  }
  .hi::after{
    content:"";position:absolute;left:22px;bottom:-7px;
    width:12px;height:12px;background:var(--surface);
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    transform:rotate(45deg);
  }

  .avatar-zone{position:relative;z-index:2;width:min(58vw,230px);height:min(58vw,230px);flex-shrink:0;
    animation:pop .55s cubic-bezier(.34,1.56,.64,1);}
  .avatar{position:relative;width:100%;height:100%;animation:floaty 5s ease-in-out infinite;}
  .img-single{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .img-single img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(60,45,30,.14));}
  @keyframes floaty{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-11px) scale(1.025);}}
  @keyframes imgHit{
    0%{transform:translate(0,0) rotate(0) scale(1);}
    12%{transform:translate(-11px,4px) rotate(-8deg) scale(1.05);}
    26%{transform:translate(13px,-5px) rotate(8deg) scale(.96);}
    42%{transform:translate(-15px,5px) rotate(-10deg) scale(1.06);}
    58%{transform:translate(12px,-4px) rotate(6deg) scale(.98);}
    74%{transform:translate(-9px,3px) rotate(-5deg) scale(1.02);}
    88%{transform:translate(6px,-2px) rotate(3deg) scale(1);}
    100%{transform:translate(0,0) rotate(0) scale(1);}
  }
  @keyframes imgFlash{0%,100%{filter:none;}18%,46%,74%{filter:drop-shadow(0 0 12px #ff5a5a) drop-shadow(0 0 5px #ff8a8a) brightness(1.3) sepia(.5) hue-rotate(-25deg) saturate(2.5);}}
  .img-hit{animation:imgHit .5s cubic-bezier(.36,.07,.19,.97), imgFlash .5s ease;transform-origin:center;}
  /* 被攻击：受击红闪+红环（用 drop-shadow 跟随 PNG 轮廓，不用方形 box-shadow） + 受击星星 */
  .hit-star{position:absolute;left:50%;top:50%;pointer-events:none;z-index:5;animation:starFly .72s ease-out forwards;}
  @keyframes starFly{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0);}
    25%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(90deg);}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)*1.9),calc(-50% + var(--dy)*1.9)) scale(.5) rotate(220deg);}
  }
  /* 被攻击飘字：放大+红色+抖动 */
  .hit-pop{font-size:25px;font-weight:800;color:#FF4D4D;text-shadow:0 2px 7px rgba(255,80,80,.45);animation:hitPopShake .55s ease;}
  @keyframes hitPopShake{0%,100%{transform:translate(-50%,-50%) rotate(0) scale(1);}20%{transform:translate(-50%,-50%) rotate(-7deg) scale(1.14);}40%{transform:translate(-50%,-50%) rotate(6deg) scale(1.06);}60%{transform:translate(-50%,-50%) rotate(-4deg) scale(1.02);}80%{transform:translate(-50%,-50%) rotate(3deg) scale(1);}}
  @keyframes pop{0%{transform:scale(.55);opacity:0;}100%{transform:scale(1);opacity:1;}}

  .carousel-box{position:absolute;inset:0;}
  .carousel{position:absolute;inset:0;overflow:hidden;border-radius:18px;}
  .carousel-track{display:flex;height:100%;transition:transform .5s cubic-bezier(.25,.46,.45,.94);}
  .carousel-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .carousel-slide img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(60,45,30,.14));}
  .carousel-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;pointer-events:none;}
  .carousel-dot{width:7px;height:7px;border-radius:50%;border:none;padding:0;background:rgba(44,38,32,.22);transition:all .3s ease;}
  .carousel-dot.active{width:18px;border-radius:4px;background:var(--accent);}

  .card{
    position:relative;z-index:2;
    width:100%;background:var(--surface);
    border:1px solid var(--line);border-radius:22px;
    padding:clamp(22px,6vw,30px) clamp(20px,5vw,26px);
    text-align:center;box-shadow:var(--shadow);
    animation:rise .45s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .card.shake{animation:shake .42s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

  .question{font-size:clamp(19px,5.2vw,22px);font-weight:700;line-height:1.55;color:var(--ink);margin-bottom:8px;}
  .counter{font-size:15px;color:var(--ink-soft);margin-bottom:18px;font-weight:500;}

  /* 圆形倒计时 */
  .ring-wrap{position:relative;width:132px;height:132px;margin:6px auto 18px;}
  .ring{transform:rotate(-90deg);width:100%;height:100%;}
  .ring-bg{fill:none;stroke:var(--line);stroke-width:9;}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;}

  /* ============ 蛋黄水母：跳动爱心 + 红水下降 ============ */
  .heart-wrap{position:relative;width:100%;height:100%;margin:0 auto;
    animation:beat 1.15s ease-in-out infinite;transform-origin:50% 55%;}
  .stage.love .avatar-zone{width:min(72vw,288px);height:min(72vw,288px);}
  @keyframes beat{
    0%,100%{transform:scale(1);}
    14%{transform:scale(1.13);}
    28%{transform:scale(1);}
    42%{transform:scale(1.07);}
    56%{transform:scale(1);}
  }
  .heart-svg{width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 10px 18px color-mix(in srgb,var(--accent) 26%,transparent));}
  .heart-water{transition:y .9s linear, height .9s linear;}
  .heart-outline{stroke:var(--accent);}
  @keyframes heartPulse{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1);}}
  .heart-wrap.pulse{animation:heartPulse .5s ease;}

  /* choice / wer 类（鸡翅包饭、路人橘、安德烈）：图略放大、选项下移 */
  .stage.spaced .avatar-zone{width:min(66vw,262px);height:min(66vw,262px);}
  .stage.spaced .card{margin-top:14px;}

  .btns{display:flex;gap:12px;margin-top:4px;}
  .btn{
    flex:1;min-height:54px;border:none;border-radius:16px;
    font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1.3;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:active{transform:scale(.94);}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent);}
  .btn.ghost{background:color-mix(in srgb,var(--ink) 6%,#fff);color:var(--ink);}

  /* ============ 结算页 ============ */
  .result{display:none;position:relative;width:100%;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, color-mix(in srgb,var(--accent) 16%,#fff), transparent 60%),
      var(--surface);
    border:1px solid var(--line);border-radius:24px;
    padding:48px 26px 36px;text-align:center;box-shadow:var(--shadow);}
  .result.show{display:block;animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes bounceIn{0%{opacity:0;transform:scale(.8) translateY(10px);}100%{opacity:1;transform:none;}}
  .result-core{position:relative;z-index:2;}
  .result-text{font-size:clamp(27px,7vw,33px);font-weight:900;color:var(--ink);margin-bottom:10px;
    animation:txtPop .6s .05s cubic-bezier(.34,1.56,.64,1) both;}
  .result-sub{font-size:15px;color:var(--ink-soft);margin-bottom:26px;line-height:1.5;
    animation:txtPop .6s .16s cubic-bezier(.34,1.56,.64,1) both;}
  .result .btn.primary{position:relative;z-index:2;animation:txtPop .6s .28s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes txtPop{from{opacity:0;transform:translateY(10px) scale(.9);}to{opacity:1;transform:none;}}

  /* 飘落丝带（CSS 层） */
  .confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:30;}
  .ribbon{position:absolute;top:-60px;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08));
    border-radius:6px;animation:ribbonFall linear forwards;}
  @keyframes ribbonFall{
    0%{transform:translateY(-20px) rotate(0deg);opacity:0;}
    12%{opacity:1;}
    100%{transform:translateY(620px) rotate(640deg);opacity:0;}
  }

  /* 浮动文字（踢正步 +10 / +20 等） */
  .float-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6;}
  .float-pop{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
    font-size:clamp(26px,8vw,40px);font-weight:900;color:var(--accent);
    text-shadow:0 2px 10px rgba(255,255,255,.8);white-space:nowrap;
    animation:floatUp 1.05s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-30%) scale(.5);}
    18%{opacity:1;transform:translate(-50%,-70%) scale(1.12);}
    100%{opacity:0;transform:translate(-50%,-180%) scale(1);}
  }
  /* 蛋黄水母：点击飘出的背景漂浮爱心（粉色，铺满全屏，慢速上升） */
  .bg-hearts{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .bg-heart{position:absolute;bottom:-44px;color:#EE99BB;opacity:.85;
    pointer-events:none;animation:bgHeartRise var(--dur,5.5s) ease-in forwards;}
  @keyframes bgHeartRise{
    0%{transform:translateY(0) translateX(0) scale(.6) rotate(-10deg);opacity:0;}
    10%{opacity:.85;}
    100%{transform:translateY(-112vh) translateX(var(--drift,24px)) scale(1.15) rotate(8deg);opacity:0;}
  }

  /* 彩带前后景物理效果：后景画布沉到图片/卡片之后，前景画布盖在最上层 */
  .conf-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:31;}
  #confettiBack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  /* 彩带落在边框上：停靠在卡片底缘，轻微回弹后停留再淡出 */
  .ribbon-rest{position:fixed;z-index:32;border-radius:5px;
    box-shadow:0 2px 6px rgba(40,30,20,.18);pointer-events:none;
    animation:ribbonRest 3.8s cubic-bezier(.3,.8,.4,1) forwards;}
  @keyframes ribbonRest{
    0%{transform:translateY(-36px) rotate(0deg);opacity:0;}
    16%{opacity:1;}
    34%{transform:translateY(0) rotate(var(--rot,0deg));}
    46%{transform:translateY(-8px) rotate(var(--rot,0deg));}
    60%{transform:translateY(0) rotate(var(--rot,0deg));}
    84%{opacity:1;}
    100%{transform:translateY(0) rotate(var(--rot,0deg));opacity:0;}
  }

  /* 弹窗 */
  .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(40,32,24,.5);}
  .modal.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal-card{width:100%;max-width:320px;background:var(--surface);border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line));
    border-radius:22px;padding:32px 24px;text-align:center;box-shadow:var(--shadow);
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  .modal-text{font-size:21px;font-weight:700;color:color-mix(in srgb,var(--accent) 58%,#2C2620);margin-bottom:24px;line-height:1.5;}

  @media(min-width:540px){
    .friend-wall{grid-template-columns:repeat(3,1fr);gap:16px 14px;}
  }
  @media(min-height:760px){.stage{gap:22px;}}

  /* 音效开关 */
  .mute-btn{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;z-index:50;transition:transform .15s ease;}
  .mute-btn:active{transform:scale(.88);}
  .mute-btn svg{width:20px;height:20px;}
</style>
</head>
<body>

<button class="mute-btn" id="muteBtn" aria-label="音效开关"></button>

<section id="selectScreen" class="screen show">
  <div class="select-head">
    <div class="select-kicker">点下面的卡片，挑一个朋友</div>
    <div class="select-title hand">你是谁？</div>
  </div>
  <div class="friend-wall" id="wall"></div>
</section>

<section id="mainScreen" class="screen">
  <div class="bg-hearts" id="bgHearts"></div>
  <button class="back" id="backBtn" aria-label="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="stage">
    <div class="hi" id="hiTag">这是</div>
    <div class="avatar-zone"><div class="avatar" id="avatar"></div></div>

    <div class="card" id="card"><div id="cardInner"></div></div>

    <div class="result" id="result">
      <div class="result-core">
        <div class="result-text" id="resultText">我们和好了！</div>
        <div class="result-sub" id="resultSub">又可以一起玩了</div>
        <button class="btn primary" id="resultBack" style="width:100%;">返回选朋友</button>
      </div>
    </div>
    <div class="float-layer" id="floatLayer"></div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-text" id="modalText">要和你绝交</div>
    <button class="btn primary" id="modalClose" style="width:100%;">关闭</button>
  </div>
</div>

<div class="confetti" id="confetti"></div>
  <canvas id="confettiFront" class="conf-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js" async></script>
<script>
  /* ===== 音效系统（Web Audio 合成，无需任何音频文件）===== */
  const SFX={
    ctx:null, enabled:true,
    ensure(){
      if(!this.ctx){
        try{ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); }catch(e){ this.ctx=null; }
      }
      if(this.ctx && this.ctx.state==='suspended'){ this.ctx.resume(); }
    },
    tone(freq,start,dur,type,peak){
      if(!this.ctx)return;
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||'sine'; o.frequency.value=freq;
      o.connect(g); g.connect(this.ctx.destination);
      const t0=this.ctx.currentTime+start;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(peak||0.18,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.start(t0); o.stop(t0+dur+0.03);
    },
    noise(start,dur,peak){
      if(!this.ctx)return;
      const n=Math.floor(this.ctx.sampleRate*dur);
      const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      const src=this.ctx.createBufferSource(); src.buffer=buf;
      const g=this.ctx.createGain(); g.gain.value=peak||0.12;
      src.connect(g); g.connect(this.ctx.destination);
      src.start(this.ctx.currentTime+start);
    },
    play(name){
      this.ensure();
      if(!this.enabled || !this.ctx)return;
      switch(name){
        case 'enter': this.tone(523,0,0.12,'triangle',0.16); this.tone(784,0.09,0.16,'triangle',0.16); break;
        case 'tap':   this.tone(660,0,0.06,'sine',0.14); break;
        case 'good':  this.tone(523,0,0.10,'sine',0.16); this.tone(659,0.07,0.10,'sine',0.16); this.tone(784,0.14,0.14,'sine',0.16); break;
        case 'bad':   this.tone(392,0,0.12,'sine',0.16); this.tone(262,0.08,0.18,'sine',0.16); break;
        case 'win':   this.tone(523,0,0.12,'triangle',0.18); this.tone(659,0.10,0.12,'triangle',0.18); this.tone(784,0.20,0.12,'triangle',0.18); this.tone(1047,0.30,0.22,'triangle',0.18); break;
        case 'alert': this.tone(330,0,0.10,'square',0.12); this.tone(330,0.14,0.10,'square',0.12); break;
        case 'hit':   this.tone(150,0,0.14,'square',0.20); this.noise(0,0.10,0.10); break;
        case 'wer':   this.tone(440,0,0.08,'square',0.14); this.tone(660,0.06,0.08,'square',0.14); this.tone(880,0.12,0.10,'square',0.14); break;
      }
    }
  };
  const muteBtn=document.getElementById('muteBtn');
  function updateMuteIcon(){
    muteBtn.innerHTML = SFX.enabled

  function setupCarousel(){

    const track=car.querySelector('.carousel-track');

    const go=i=>{idx=(i+count)%count;track.style.transform=`translateX(-${idx*100}%)`;dots.forEach((d,i)=>d.classList.toggle('active',i===idx));};

    r.style.background=`linear-gradient(180deg,${p[0]},${p[1]})`;
    r.style.left=(Math.random()*100)+'%';
    r.style.width=(7+Math.random()*7)+'px';
    r.style.height=(26+Math.random()*18)+'px';
    r.style.animationDuration=(2.8+Math.random()*1.8)+'s';
    confettiBox.appendChild(r);
  }
  /* 蚕豆豆：拉豆豆 —— 每点一次豆豆+N，飘字 + 彩带 + 丝带（比 werwer 稍轻一点） */
  function douBark(o){
    douCount++;
    SFX.play('good');
    floatText('豆豆+'+o.amount);
    douConfetti(o.amount);
    spawnOneRibbon(douCount);
    spawnRestRibbons(3);
  }
  function douConfetti(amount){
    const accent=getComputedStyle(mainScreen).getPropertyValue('--accent').trim()||'#C9A06A';
    const colors=[accent].concat(PALETTE);
    const n=(amount===2?38:22);
    layeredBurst({particleCount:n,spread:80,startVelocity:40,origin:{y:0.62},colors,scalar:1.1,shapes:['ribbon','square'],ticks:190});
    setTimeout(()=>layeredBurst({particleCount:Math.round(n*0.6),angle:60,spread:50,origin:{x:0},colors,shapes:['ribbon','square']}),120);
    setTimeout(()=>layeredBurst({particleCount:Math.round(n*0.6),angle:120,spread:50,origin:{x:1},colors,shapes:['ribbon','square']}),120);
  }
  function startTimer(onTimeout){
    clearInterval(timer);
    timer=setInterval(()=>{
      if(modalOpen)return;
      time--;
      if(tickUpdate)tickUpdate();
      if(time<=0){clearInterval(timer);timer=null;onTimeout?onTimeout():reconcile();}
    },1000);
  }
  function reconcile(){showResult('我们和好了！','又可以一起玩了');}

  function showResult(text,sub){
    clearInterval(timer); timer=null;
    SFX.play('win');
    card.style.display='none';
    resultText.textContent=text;
    if(sub===undefined||sub===''){resultSub.style.display='none';}
    else{resultSub.style.display=''; resultSub.textContent=sub;}
    result.classList.add('show');
    celebrate();
    spawnRibbons();
  }

  /* canvas-confetti 丝带彩带（小红书/抖音风，最火的庆祝库） */
  function celebrate(){
    const accent=getComputedStyle(mainScreen).getPropertyValue('--accent').trim()||'#C9A06A';
    const colors=[accent].concat(PALETTE);
    layeredBurst({particleCount:130,spread:85,startVelocity:46,origin:{y:0.7},colors,scalar:1.15,shapes:['ribbon','square','circle'],ticks:200});
    setTimeout(()=>layeredBurst({particleCount:90,angle:60,spread:55,origin:{x:0},colors,shapes:['ribbon','square']}),180);
    setTimeout(()=>layeredBurst({particleCount:90,angle:120,spread:55,origin:{x:1},colors,shapes:['ribbon','square']}),180);
    let n=0;
    const iv=setInterval(()=>{
      layeredBurst({particleCount:34,spread:100,startVelocity:26,origin:{y:0},colors,scalar:0.9,shapes:['ribbon']});
      if(++n>4)clearInterval(iv);
    },320);
    spawnRestRibbons(6);
  }

  /* 飘落丝带（CSS 层，保证丝带质感） */
  function spawnRibbons(){
    confettiBox.innerHTML='';
    const pairs=[['#EE99BB','#F2A0C4'],['#8FC4E8','#9FD0EC'],['#F4B860','#F6C97A'],['#7FC8A9','#9AD9BD'],['#E0907A','#EFA68F'],['#9DBE5E','#B7D27E']];
    for(let i=0;i<18;i++){
      const r=document.createElement('span');
      r.className='ribbon';
      const p=pairs[i%pairs.length];
      r.style.background=`linear-gradient(180deg,${p[0]},${p[1]})`;
      const left=Math.random()*100;
      const dur=2.8+Math.random()*1.8;
      const w=7+Math.random()*7, h=26+Math.random()*18;
      r.style.left=left+'%';
      r.style.width=w+'px';
      r.style.height=h+'px';
      r.style.animationDuration=dur+'s';
      r.style.animationDelay=(Math.random()*0.9)+'s';
      confettiBox.appendChild(r);
    }
  }

  function openModal(text,btnLabel,onConfirm){
    modalOpen=true; clearInterval(timer); timer=null;
    SFX.play('alert');
    modalText.textContent=text;
    modalClose.textContent=btnLabel||'关闭';
    modalClose.onclick=()=>{
      SFX.play('tap');
      modal.classList.remove('show'); modalOpen=false;
      if(onConfirm)onConfirm();
    };
    modal.classList.add('show');
  }
  function openForceModal(text){openModal(text,'好',()=>showResult('好，一直好！','我喜欢你'));}
  modal.addEventListener('click',e=>{if(e.target===modal)modalClose.click();});

  function back(){
    clearInterval(timer); clearInterval(carouselTimer); timer=carouselTimer=null;
    confettiBox.innerHTML='';
    floatLayer.innerHTML='';
    mainScreen.classList.remove('show');
    setTimeout(()=>{selectScreen.classList.add('show');avatar.innerHTML='';cardInner.innerHTML='';},200);
  }
  backBtn.onclick=()=>{ SFX.play('tap'); back(); }; resultBack.onclick=()=>{ SFX.play('tap'); back(); };

  buildWall();
  document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
